name: 'Cachly Brain Setup'
description: 'Configure AI Brain memory for your repo — generates copilot-instructions.md, .mcp.json, indexes the codebase, and scans PRs for predicted failures'
author: 'cachly'
branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  instance-id:
    description: 'Cachly Brain instance UUID (from cachly.dev/instances)'
    required: true
  api-key:
    description: 'Cachly API key — cky_live_... (store as GitHub Secret!)'
    required: true
  api-url:
    description: 'Cachly API URL'
    required: false
    default: 'https://api.cachly.dev'
  embed-provider:
    description: 'Embedding provider (openai, ollama, mistral, cohere, gemini)'
    required: false
    default: 'openai'
  project-description:
    description: 'Short project description for generated instructions'
    required: false
    default: ''
  index-project:
    description: 'Whether to index the project codebase into the Brain (true/false)'
    required: false
    default: 'true'
  index-max-files:
    description: 'Maximum number of files to index per run'
    required: false
    default: '500'
  mode:
    description: |
      Action mode:
        "setup"    — generate config + index codebase (default, runs on push to main)
        "learn"    — auto-learn lessons from recent git commits (ideal on PR merge)
        "scan"     — scan an open PR for predicted failure modes and post a comment
        "predict"  — sticky "your Brain would have warned you" PR comment (create-or-update, never spams)
        "hygiene"  — sweep Brain for stale/orphan lessons and flag/archive them (weekly schedule)
        "confirm"  — report CI outcome back to the Brain to self-calibrate confidence (run at end of pipeline)
    required: false
    default: 'setup'
  learn-max-commits:
    description: 'In learn mode: how many recent commits to learn from'
    required: false
    default: '50'
  pr-number:
    description: 'In scan mode: PR number to comment on (e.g. ${{ github.event.pull_request.number }})'
    required: false
    default: ''
  pr-title:
    description: 'In scan mode: PR title for context matching (e.g. ${{ github.event.pull_request.title }})'
    required: false
    default: ''
  pr-body:
    description: 'In scan mode: PR description for context matching'
    required: false
    default: ''
  scan-top-k:
    description: 'In scan mode: maximum number of failure modes to surface (1–20)'
    required: false
    default: '7'
  scan-post-comment:
    description: 'In scan mode: post the result as a PR comment (true/false). Requires the GITHUB_TOKEN env var.'
    required: false
    default: 'true'
  predict-comment:
    description: |
      Post ONE sticky Brain prediction comment on the PR ("your Brain would have
      warned you"). The comment is created once and updated in place on every
      push (marker: <!-- cachly-brain-predict -->) — it never spams a new comment
      per commit. Runs standalone via mode "predict", or alongside mode "scan"
      (where it replaces the legacy per-push scan comment). Needs pr-number,
      pr-title and a github-token with pull-requests: write.
    required: false
    default: 'false'
  github-token:
    description: 'In predict mode: token used to read the PR changed files and create/update the sticky comment (needs pull-requests: write). Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  predict-min-confidence:
    description: 'In predict mode: minimum confidence (0–1) a predicted failure needs to appear in the sticky comment'
    required: false
    default: '0.5'
  ci-job-status:
    description: 'In confirm mode: outcome of the CI job — "success", "failure", or "cancelled"'
    required: false
    default: ''
  ci-topics:
    description: 'In confirm mode: comma-separated list of Brain topics touched by this CI run (e.g. "auth:jwt,deploy:k8s")'
    required: false
    default: ''
  ci-scan-topics:
    description: 'In confirm mode: comma-separated topics the brain predicted would fail (from a previous scan step). Used to detect false positives.'
    required: false
    default: ''

outputs:
  instructions-path:
    description: 'Path to generated copilot-instructions.md'
    value: ${{ steps.setup.outputs.instructions-path }}
  indexed-files:
    description: 'Number of files indexed into the Brain (if index-project=true)'
    value: ${{ steps.index.outputs.indexed-files }}
  risk-score:
    description: 'In scan mode: 0–100 risk score for the PR (0 = no known issues)'
    value: ${{ steps.scan.outputs.risk-score }}
  failures-json:
    description: 'In scan mode: JSON array of predicted failure modes'
    value: ${{ steps.scan.outputs.failures-json }}
  predict-warnings:
    description: 'In predict mode: number of Brain warnings above the confidence threshold surfaced on the PR'
    value: ${{ steps.predict.outputs.warnings }}
  ci-updated:
    description: 'In confirm mode: number of lesson confidences updated'
    value: ${{ steps.confirm.outputs.ci-updated }}

runs:
  using: 'composite'
  steps:
    # ── mode: setup ────────────────────────────────────────────────────────────
    - name: Setup Cachly Brain
      id: setup
      if: ${{ inputs.mode == 'setup' }}
      shell: bash
      run: |
        set -euo pipefail

        INSTRUCTIONS_DIR=".github"
        INSTRUCTIONS_FILE="$INSTRUCTIONS_DIR/copilot-instructions.md"
        MCP_FILE=".mcp.json"

        mkdir -p "$INSTRUCTIONS_DIR"

        PROJECT_DESC="${{ inputs.project-description }}"
        if [ -z "$PROJECT_DESC" ]; then
          PROJECT_DESC="$(basename "$GITHUB_REPOSITORY")"
        fi

        # Generate copilot-instructions.md
        cat > "$INSTRUCTIONS_FILE" << 'INSTRUCTIONS_EOF'
        # Cachly AI Brain — Instructions for ALL AI Assistants

        > Auto-generated by cachly-brain-setup GitHub Action.

        ## At the START of every session

        Call `session_start` before reading any source files:

        ```
        session_start(
          instance_id = "${{ inputs.instance-id }}",
          focus       = "<what you plan to work on today>",
        )
        ```

        ## At the END of every session

        ```
        session_end(
          instance_id     = "${{ inputs.instance-id }}",
          summary         = "What was accomplished",
          files_changed   = ["src/..."],
          lessons_learned = 1,
        )
        ```

        ## After fixing any bug or learning something

        ```
        learn_from_attempts(
          instance_id = "${{ inputs.instance-id }}",
          topic       = "category:keyword",
          outcome     = "success",
          what_worked = "...",
          what_failed = "...",
        )
        ```

        ## Before any task — check for known solutions

        ```
        recall_best_solution(topic = "relevant:topic")
        ```
        INSTRUCTIONS_EOF

        # Remove leading whitespace from heredoc
        sed -i.bak 's/^        //' "$INSTRUCTIONS_FILE" && rm -f "${INSTRUCTIONS_FILE}.bak"

        # Generate .mcp.json if it doesn't exist
        if [ ! -f "$MCP_FILE" ]; then
          cat > "$MCP_FILE" << MCP_EOF
        {
          "mcpServers": {
            "cachly": {
              "command": "npx",
              "args": ["-y", "@cachly-dev/mcp-server"],
              "env": {
                "CACHLY_API_KEY": "\${{ inputs.api-key }}",
                "CACHLY_BRAIN_INSTANCE_ID": "${{ inputs.instance-id }}",
                "CACHLY_API_URL": "${{ inputs.api-url }}"
              }
            }
          }
        }
        MCP_EOF
        fi

        echo "instructions-path=$INSTRUCTIONS_FILE" >> "$GITHUB_OUTPUT"
        echo "✅ Cachly Brain configured: $INSTRUCTIONS_FILE"

    - name: Index project into Brain
      id: index
      if: ${{ inputs.mode == 'setup' && inputs.index-project == 'true' }}
      shell: bash
      env:
        CACHLY_JWT: ${{ inputs.api-key }}
        CACHLY_BRAIN_INSTANCE_ID: ${{ inputs.instance-id }}
        CACHLY_API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        echo "🧠 Indexing project into Cachly Brain..."
        echo "   Instance: $CACHLY_BRAIN_INSTANCE_ID"
        echo "   Max files: ${{ inputs.index-max-files }}"

        RESULT=$(npx --yes @cachly-dev/mcp-server@latest index . \
          --instance-id "$CACHLY_BRAIN_INSTANCE_ID" \
          --max-files "${{ inputs.index-max-files }}" 2>&1) || true

        echo "$RESULT"

        INDEXED=$(echo "$RESULT" | grep -oE '[0-9]+ (file|files) indexed' | grep -oE '^[0-9]+' || echo "0")
        echo "indexed-files=$INDEXED" >> "$GITHUB_OUTPUT"
        echo "✅ Brain indexing complete: $INDEXED files"

    # ── mode: learn ────────────────────────────────────────────────────────────
    - name: Learn from git commits (PR merge)
      id: learn
      if: ${{ inputs.mode == 'learn' }}
      shell: bash
      env:
        CACHLY_JWT: ${{ inputs.api-key }}
        CACHLY_BRAIN_INSTANCE_ID: ${{ inputs.instance-id }}
        CACHLY_API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        echo "🧠 Auto-learning from recent git commits..."
        echo "   Instance: $CACHLY_BRAIN_INSTANCE_ID"
        echo "   Max commits: ${{ inputs.learn-max-commits }}"
        echo ""
        echo "   ⚠️  Ensure your checkout step uses fetch-depth >= ${{ inputs.learn-max-commits }}"
        echo "       so the commit history is available."
        echo ""

        npx --yes @cachly-dev/mcp-server@latest learn-git . \
          --instance-id "$CACHLY_BRAIN_INSTANCE_ID" \
          --max-commits "${{ inputs.learn-max-commits }}" || true

        echo "✅ Brain learned from merged commits."

    # ── mode: scan ─────────────────────────────────────────────────────────────
    - name: Brain risk scan (PR failure prediction)
      id: scan
      if: ${{ inputs.mode == 'scan' }}
      shell: bash
      env:
        CACHLY_API_KEY: ${{ inputs.api-key }}
        CACHLY_API_URL: ${{ inputs.api-url }}
        CACHLY_INSTANCE_ID: ${{ inputs.instance-id }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        SCAN_TOP_K: ${{ inputs.scan-top-k }}
        POST_COMMENT: ${{ inputs.scan-post-comment }}
        PREDICT_COMMENT: ${{ inputs.predict-comment }}
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        echo "🧠 Cachly Brain — scanning PR for predicted failures..."
        echo "   Instance: $CACHLY_INSTANCE_ID"
        echo "   PR: #${PR_NUMBER} — ${PR_TITLE}"

        # ── Call the scan API ─────────────────────────────────────────────────
        PAYLOAD=$(printf '{"pr_title":"%s","pr_body":"%s","top_k":%s}' \
          "$(echo "$PR_TITLE" | sed 's/"/\\"/g')" \
          "$(echo "$PR_BODY"  | head -c 1800 | sed 's/"/\\"/g; s/\n/ /g')" \
          "$SCAN_TOP_K")

        RESPONSE=$(curl -sf \
          -X POST \
          -H "Authorization: Bearer $CACHLY_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${CACHLY_API_URL}/api/v1/instances/${CACHLY_INSTANCE_ID}/scan" 2>&1) || {
          echo "⚠️  Brain scan API unreachable — skipping (non-blocking)."
          echo "risk-score=0"  >> "$GITHUB_OUTPUT"
          echo "failures-json=[]" >> "$GITHUB_OUTPUT"
          exit 0
        }

        RISK_SCORE=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('risk_score',0))" 2>/dev/null || echo "0")
        FAILURES_JSON=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('failures',[])))" 2>/dev/null || echo "[]")
        MATCHED=$(echo "$RESPONSE"      | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('matched_lessons',0))" 2>/dev/null || echo "0")
        SAFE_NOTE=$(echo "$RESPONSE"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('safe_note',''))" 2>/dev/null || echo "")

        echo "risk-score=$RISK_SCORE"     >> "$GITHUB_OUTPUT"
        echo "failures-json=$FAILURES_JSON" >> "$GITHUB_OUTPUT"

        echo ""
        echo "🔍 Brain scan complete: risk_score=$RISK_SCORE, matched_lessons=$MATCHED"

        # ── Format risk indicator ─────────────────────────────────────────────
        if   [ "$RISK_SCORE" -ge 70 ]; then RISK_ICON="🔴"; RISK_LABEL="High"
        elif [ "$RISK_SCORE" -ge 35 ]; then RISK_ICON="🟡"; RISK_LABEL="Medium"
        else                                 RISK_ICON="🟢"; RISK_LABEL="Low"
        fi

        # ── Build markdown comment ────────────────────────────────────────────
        COMMENT_BODY="## 🧠 Cachly Brain — PR Risk Scan

        **Risk score:** ${RISK_ICON} **${RISK_LABEL}** (${RISK_SCORE}/100) · ${MATCHED} matching lessons in Brain

        "

        if [ -n "$SAFE_NOTE" ]; then
          COMMENT_BODY="${COMMENT_BODY}> ${SAFE_NOTE}

        "
        fi

        # Parse failures and append rows
        FAILURE_ROWS=$(echo "$FAILURES_JSON" | python3 -c "
        import sys, json
        failures = json.load(sys.stdin)
        if not failures:
            print('_No matching failure patterns found in Brain._')
            sys.exit(0)
        rows = []
        sev_icon = {'critical': '🔴', 'major': '🟠', 'minor': '🟡', 'info': '🔵'}
        for f in failures:
            icon   = sev_icon.get(f.get('severity','info'), '⚪')
            topic  = f.get('topic','?')
            conf   = int(f.get('confidence', 0) * 100)
            msg    = (f.get('message','') or '')[:120]
            fix    = (f.get('fix','') or '')[:120]
            cmds   = f.get('commands') or []
            cmd_str = ' \`' + '\`, \`'.join(cmds[:2]) + '\`' if cmds else ''
            rows.append(f'| {icon} \`{topic}\` | {conf}% | {msg} | {fix}{cmd_str} |')
        print('| Severity | Topic | Confidence | Known issue | Suggested fix |')
        print('|---|---|---|---|---|')
        for r in rows:
            print(r)
        " 2>/dev/null || echo "_Could not parse failure data._")

        COMMENT_BODY="${COMMENT_BODY}${FAILURE_ROWS}

        ---
        <sub>🧠 Powered by [Cachly Brain](https://cachly.dev) · lessons from your team's git history · [cachly-dev/cachly-action](https://github.com/cachly-dev/cachly-action)</sub>"

        # Remove leading whitespace from heredoc indentation
        COMMENT_BODY=$(echo "$COMMENT_BODY" | sed 's/^        //')

        echo ""
        echo "--- Brain scan comment preview ---"
        echo "$COMMENT_BODY"
        echo "----------------------------------"

        # ── Post PR comment ───────────────────────────────────────────────────
        # When predict-comment is enabled the sticky prediction comment (step
        # "predict") supersedes this legacy per-push comment — skip it here.
        if [ "${PREDICT_COMMENT:-false}" = "true" ]; then
          echo "ℹ️  predict-comment enabled — legacy scan comment skipped (sticky comment takes over)."
        elif [ "$POST_COMMENT" = "true" ] && [ -n "$PR_NUMBER" ] && [ -n "${GH_TOKEN:-}" ]; then
          echo "$COMMENT_BODY" | gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file - && echo "✅ Brain scan comment posted on PR #$PR_NUMBER"
        else
          echo "ℹ️  Comment posting skipped (POST_COMMENT=$POST_COMMENT, PR_NUMBER=$PR_NUMBER)"
        fi

    # ── mode: predict / predict-comment ────────────────────────────────────────
    - name: Brain prediction sticky PR comment
      id: predict
      if: ${{ inputs.mode == 'predict' || inputs.predict-comment == 'true' }}
      shell: bash
      env:
        CACHLY_API_KEY: ${{ inputs.api-key }}
        CACHLY_API_URL: ${{ inputs.api-url }}
        CACHLY_INSTANCE_ID: ${{ inputs.instance-id }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        SCAN_TOP_K: ${{ inputs.scan-top-k }}
        MIN_CONFIDENCE: ${{ inputs.predict-min-confidence }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        MARKER='<!-- cachly-brain-predict -->'
        GH_API="${GITHUB_API_URL:-https://api.github.com}"

        echo "🧠 Cachly Brain — prediction check for PR #${PR_NUMBER:-?}..."

        # Everything in this step is best-effort: a missing secret or an
        # unreachable Brain must never fail the host CI.
        if [ -z "${CACHLY_API_KEY:-}" ] || [ -z "${CACHLY_INSTANCE_ID:-}" ]; then
          echo "⚠️  api-key / instance-id not configured — skipping (non-blocking)."
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "${PR_NUMBER:-}" ] || [ -z "${PR_TITLE:-}" ]; then
          echo "ℹ️  pr-number / pr-title missing — predict-comment only runs on pull_request events."
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── Changed files via GitHub API (optional — degrades to title+body) ──
        CHANGED_FILES=""
        if [ -n "${GH_TOKEN:-}" ]; then
          FILES_JSON=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100") || FILES_JSON="[]"
          CHANGED_FILES=$(echo "$FILES_JSON" | python3 -c "import sys, json; d = json.load(sys.stdin); print(' '.join(f.get('filename', '') for f in d if isinstance(f, dict)))" 2>/dev/null || echo "")
        fi

        # ── Ask the Brain: PR context → predicted failures ────────────────────
        # (env-passed python, single expression — values can't break out of the literal)
        PAYLOAD=$(PR_TITLE="$PR_TITLE" PR_BODY="${PR_BODY:-}" CHANGED_FILES="$CHANGED_FILES" TOP_K="$SCAN_TOP_K" python3 -c "import os, json; print(json.dumps({'pr_title': os.environ.get('PR_TITLE', '')[:300], 'pr_body': (os.environ.get('PR_BODY', '')[:1200] + ' Changed files: ' + os.environ.get('CHANGED_FILES', '')[:1500]).strip(), 'top_k': int(os.environ.get('TOP_K') or 7)}))") || {
          echo "⚠️  Could not build scan payload — skipping (non-blocking)."
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          exit 0
        }

        RESPONSE=$(curl -sf \
          -X POST \
          -H "Authorization: Bearer $CACHLY_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${CACHLY_API_URL}/api/v1/instances/${CACHLY_INSTANCE_ID}/scan") || {
          echo "⚠️  Brain scan API unreachable — skipping (non-blocking)."
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # ── Filter to meaningful confidence, render bullet list ───────────────
        # First output line = warning count, remaining lines = markdown bullets.
        PREDICT_MD=$(RESPONSE="$RESPONSE" MIN_CONF="$MIN_CONFIDENCE" python3 -c "
        import os, json
        try:
            d = json.loads(os.environ.get('RESPONSE') or '{}')
        except ValueError:
            d = {}
        try:
            min_conf = float(os.environ.get('MIN_CONF') or 0.5)
        except ValueError:
            min_conf = 0.5
        sev_icon = {'critical': '🔴', 'major': '🟠', 'minor': '🟡', 'info': '🔵'}
        warns = [f for f in d.get('failures', []) if isinstance(f, dict) and float(f.get('confidence') or 0) >= min_conf]
        print(len(warns))
        for f in warns:
            icon = sev_icon.get(f.get('severity', 'info'), '⚪')
            conf = int(float(f.get('confidence') or 0) * 100)
            topic = f.get('topic', '?')
            msg = (f.get('message', '') or '').replace(chr(10), ' ')[:160]
            fix = (f.get('fix', '') or '').replace(chr(10), ' ')[:160]
            line = f'- {icon} \`{topic}\` — **{conf}% confidence** — {msg}'
            if fix:
                line += f' → Fix: {fix}'
            print(line)
        " 2>/dev/null || echo "0")

        WARN_COUNT=$(echo "$PREDICT_MD" | head -n 1)
        BULLETS=$(echo "$PREDICT_MD" | tail -n +2)
        case "$WARN_COUNT" in
          ''|*[!0-9]*) WARN_COUNT=0 ;;
        esac
        echo "warnings=$WARN_COUNT" >> "$GITHUB_OUTPUT"
        echo "🔍 Brain prediction complete: $WARN_COUNT warning(s) at ≥ ${MIN_CONFIDENCE} confidence."

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "ℹ️  No github-token — printing predictions instead of commenting:"
          echo "$BULLETS"
          exit 0
        fi

        # ── Find the existing sticky comment (marker-based, never spams) ──────
        COMMENTS=$(curl -sf \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "${GH_API}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100") || COMMENTS="[]"

        STICKY_ID=$(echo "$COMMENTS" | python3 -c "
        import sys, json
        try:
            comments = json.load(sys.stdin)
        except ValueError:
            comments = []
        for c in comments:
            if isinstance(c, dict) and '<!-- cachly-brain-predict -->' in (c.get('body') or ''):
                print(c.get('id', ''))
                break
        " 2>/dev/null || echo "")

        NL=$'\n'
        FOOTER="<sub>🧠 Powered by [Cachly Brain](https://cachly.dev) — lessons from your team's git history, surfaced before CI fails.</sub>"

        if [ "$WARN_COUNT" -gt 0 ]; then
          if [ "$WARN_COUNT" = "1" ]; then
            HEADING="🧠 Cachly Brain: 1 Warnung für diesen PR"
          else
            HEADING="🧠 Cachly Brain: ${WARN_COUNT} Warnungen für diesen PR"
          fi
          COMMENT_BODY="${MARKER}${NL}## ${HEADING}${NL}${NL}Your Brain has seen these patterns fail before:${NL}${NL}${BULLETS}${NL}${NL}${FOOTER}"
        elif [ -n "$STICKY_ID" ]; then
          # No predictions: never open a new comment — only collapse an existing one.
          COMMENT_BODY="${MARKER}${NL}<details>${NL}<summary>🧠 Cachly Brain: no known risks for this PR</summary>${NL}${NL}No known failure patterns match the latest changes — earlier warnings no longer apply.${NL}${NL}</details>${NL}${NL}${FOOTER}"
        else
          echo "✅ No predictions above threshold and no existing sticky comment — staying silent."
          exit 0
        fi

        JSON_BODY=$(COMMENT_BODY="$COMMENT_BODY" python3 -c "import os, json; print(json.dumps({'body': os.environ['COMMENT_BODY']}))") || {
          echo "⚠️  Could not encode comment body — skipping (non-blocking)."
          exit 0
        }

        if [ -n "$STICKY_ID" ]; then
          curl -sf -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$JSON_BODY" \
            "${GH_API}/repos/${GITHUB_REPOSITORY}/issues/comments/${STICKY_ID}" > /dev/null \
            && echo "✅ Sticky Brain comment updated on PR #${PR_NUMBER}." \
            || echo "⚠️  Could not update sticky comment (non-blocking)."
        else
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$JSON_BODY" \
            "${GH_API}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" > /dev/null \
            && echo "✅ Sticky Brain comment posted on PR #${PR_NUMBER}." \
            || echo "⚠️  Could not post sticky comment (non-blocking)."
        fi

    # ── mode: hygiene ──────────────────────────────────────────────────────────
    - name: Brain hygiene sweep (autonomous maintenance)
      id: hygiene
      if: ${{ inputs.mode == 'hygiene' }}
      shell: bash
      env:
        CACHLY_API_KEY: ${{ inputs.api-key }}
        CACHLY_API_URL: ${{ inputs.api-url }}
        CACHLY_INSTANCE_ID: ${{ inputs.instance-id }}
      run: |
        set -euo pipefail

        echo "🧹 Cachly Brain — running hygiene sweep..."
        echo "   Instance: $CACHLY_INSTANCE_ID"

        # Run the brain_hygiene MCP tool via the server CLI
        RESULT=$(npx --yes @cachly-dev/mcp-server@latest hygiene \
          --instance-id "$CACHLY_INSTANCE_ID" 2>&1) || {
          echo "⚠️  Brain hygiene CLI unavailable — falling back to API call."
          # Fallback: call the brain_hygiene tool via the /api/v1/mcp endpoint if available
          RESULT=$(curl -sf \
            -X POST \
            -H "Authorization: Bearer $CACHLY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"tool\":\"brain_hygiene\",\"args\":{\"instance_id\":\"$CACHLY_INSTANCE_ID\"}}" \
            "${CACHLY_API_URL}/api/v1/mcp/call" 2>&1) || RESULT="Hygiene skipped (offline)"
        }

        echo "$RESULT"
        echo "✅ Brain hygiene sweep complete."

    # ── mode: confirm ───────────────────────────────────────────────────────────
    - name: Confirm CI outcome to Brain (closed-loop calibration)
      id: confirm
      if: ${{ inputs.mode == 'confirm' }}
      shell: bash
      env:
        CACHLY_API_KEY: ${{ inputs.api-key }}
        CACHLY_API_URL: ${{ inputs.api-url }}
        CACHLY_INSTANCE_ID: ${{ inputs.instance-id }}
        JOB_STATUS: ${{ inputs.ci-job-status }}
        CI_TOPICS: ${{ inputs.ci-topics }}
        CI_SCAN_TOPICS: ${{ inputs.ci-scan-topics }}
      run: |
        set -euo pipefail

        echo "🤖 Cachly Brain — reporting CI outcome for self-calibration..."
        echo "   Instance: $CACHLY_INSTANCE_ID"
        echo "   Status:   $JOB_STATUS"

        # Degrade gracefully without secrets — never fail the host CI.
        if [ -z "${CACHLY_API_KEY:-}" ] || [ -z "${CACHLY_INSTANCE_ID:-}" ]; then
          echo "⚠️  api-key / instance-id not configured — skipping Brain confirm (non-blocking)."
          echo "ci-updated=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── CI failure → Brain lesson (auto-learn) ─────────────────────────────
        # A red pipeline becomes a lesson in the documented format
        # (topic / outcome / what_worked / what_failed), so the next PR scan
        # can warn: "your Brain would have warned you". Best-effort only.
        if [ "$JOB_STATUS" = "failure" ]; then
          LESSON_TOPIC=$(echo "$CI_TOPICS" | cut -d',' -f1 | tr -d ' ')
          if [ -z "$LESSON_TOPIC" ]; then
            LESSON_TOPIC="ci:${GITHUB_REPOSITORY##*/}"
          fi
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-0}"
          LESSON_PAYLOAD=$(LESSON_TOPIC="$LESSON_TOPIC" RUN_URL="$RUN_URL" CI_TOPICS="$CI_TOPICS" python3 -c "import os, json; topics = [t.strip() for t in os.environ.get('CI_TOPICS', '').split(',') if t.strip()]; print(json.dumps({'topic': os.environ['LESSON_TOPIC'], 'outcome': 'failure', 'what_worked': 'Not yet resolved - inspect the failing run: ' + os.environ['RUN_URL'], 'what_failed': 'CI failed' + ((' for topics: ' + ', '.join(topics)) if topics else '') + ' - ' + os.environ['RUN_URL'], 'severity': 'major', 'tags': ['ci', 'auto-learn'], 'source': 'github_actions'}))" 2>/dev/null) || LESSON_PAYLOAD=""
          if [ -n "$LESSON_PAYLOAD" ]; then
            curl -sf \
              -X POST \
              -H "Authorization: Bearer $CACHLY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$LESSON_PAYLOAD" \
              "${CACHLY_API_URL}/api/v1/instances/${CACHLY_INSTANCE_ID}/learn" > /dev/null \
              && echo "🧠 CI failure recorded as Brain lesson: $LESSON_TOPIC" \
              || echo "⚠️  Brain learn API unreachable — failure lesson skipped (non-blocking)."
          fi
        fi

        if [ -z "$CI_TOPICS" ]; then
          echo "⚠️  ci-topics is empty — nothing to confirm."
          echo "ci-updated=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Convert comma-separated topics to JSON arrays (single-line python to
        # keep the body off column 0 — column-0 heredocs break YAML literal blocks).
        TOPICS_JSON=$(echo "$CI_TOPICS" | python3 -c "import sys, json; print(json.dumps([t.strip() for t in sys.stdin.read().split(',') if t.strip()]))")

        SCAN_JSON="[]"
        if [ -n "$CI_SCAN_TOPICS" ]; then
          SCAN_JSON=$(echo "$CI_SCAN_TOPICS" | python3 -c "import sys, json; print(json.dumps([t.strip() for t in sys.stdin.read().split(',') if t.strip()]))")
        fi

        # Pass values via env (not source interpolation) so topics/status can't break out of the python literal.
        PAYLOAD=$(JOB_STATUS="$JOB_STATUS" TOPICS_JSON="$TOPICS_JSON" SCAN_JSON="$SCAN_JSON" python3 -c "import os, json; print(json.dumps({'job_status': os.environ['JOB_STATUS'], 'topics': json.loads(os.environ['TOPICS_JSON']), 'scan_topics': json.loads(os.environ['SCAN_JSON']), 'source': 'github_actions'}))")

        RESPONSE=$(curl -sf \
          -X POST \
          -H "Authorization: Bearer $CACHLY_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${CACHLY_API_URL}/api/v1/instances/${CACHLY_INSTANCE_ID}/ci-outcome" 2>&1) || {
          echo "⚠️  Brain CI outcome API unreachable — skipping (non-blocking)."
          echo "ci-updated=0" >> "$GITHUB_OUTPUT"
          exit 0
        }

        UPDATED=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('updated',0))" 2>/dev/null || echo "0")
        echo "ci-updated=$UPDATED" >> "$GITHUB_OUTPUT"

        if [ "$UPDATED" -gt 0 ]; then
          echo "✅ Brain self-calibrated: $UPDATED lesson confidence(s) updated from CI signal."
        else
          echo "✅ Brain confirmed — no confidence changes needed."
        fi
